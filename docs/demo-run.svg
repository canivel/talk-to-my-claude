<text x="359" y="23" text-anchor="middle" font-size="12" fill="#5b6371">pnpm demo</text>
<text x="26" y="64" font-size="15" font-weight="700" fill="#35d0d8">talk-to-my-claude<tspan font-weight="400" fill="#5b6371">  · end-to-end, no inference key</tspan></text>
<g class="s0"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 1 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">Set up who my agent speaks for</text><text class="l0_0" x="26" y="141"><tspan xml:space="preserve" fill="#35d07f">persona v2</tspan><tspan xml:space="preserve" >  2 standing positions</tspan></text><text class="l0_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1">may commit up to</tspan><tspan xml:space="preserve" > </tspan><tspan xml:space="preserve" fill="#ffffff">$25,000</tspan><tspan xml:space="preserve" fill="#8b93a1">, and no scope</tspan></text><text class="l0_2" x="26" y="191"><tspan xml:space="preserve" fill="#8b93a1">no inference key involved — my own Claude does the thinking</tspan></text></g>
<g class="s1"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 2 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">Someone sends me this</text><text class="l1_0" x="26" y="141"><tspan xml:space="preserve" fill="#8b93a1">"I hope this email finds you well. Circling back on the</tspan></text><text class="l1_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1"> migration window. It's not just a scheduling question…"</tspan></text><text class="l1_2" x="26" y="191"><tspan xml:space="preserve" fill="#ff5f56" font-weight="700">54/100</tspan><tspan xml:space="preserve" > boilerplate </tspan><tspan xml:space="preserve" fill="#8b93a1">·</tspan><tspan xml:space="preserve" > 54% of it says nothing</tspan></text><text class="l1_3" x="26" y="216"><tspan xml:space="preserve" fill="#8b93a1">tells: house-style vocabulary, ceremonial opener, ceremonial closer</tspan></text></g>
<g class="s2"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 3 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">My Claude answers, and the relay signs it</text><text class="l2_0" x="26" y="141"><tspan xml:space="preserve" fill="#8b93a1">"Friday doesn't work — the board demo runs Friday at 2pm.</tspan></text><text class="l2_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1"> Monday morning, or Wednesday if you need numbers sooner."</tspan></text><text class="l2_2" x="26" y="191"><tspan xml:space="preserve" fill="#35d07f">27 words out</tspan><tspan xml:space="preserve" fill="#8b93a1">, answering 72 in — and it disagrees</tspan></text><text class="l2_3" x="26" y="216"><tspan xml:space="preserve" fill="#35d0d8">🤖 Danilo's Claude wrote this · not reviewed by a human</tspan></text></g>
<g class="s3"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 4 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">Anyone can check that signature — no account needed</text><text class="l3_0" x="26" y="141"><tspan xml:space="preserve" fill="#35d07f" font-weight="700">valid</tspan><tspan xml:space="preserve" >    </tspan><tspan xml:space="preserve" fill="#8b93a1">written by an agent · claude-opus-5 · persona v2</tspan></text><text class="l3_1" x="26" y="166"><tspan xml:space="preserve" fill="#ff5f56" font-weight="700">invalid</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">after editing a single sentence → content_mismatch</tspan></text><text class="l3_2" x="26" y="191"><tspan xml:space="preserve" fill="#8b93a1">the forgery that matters is "a human wrote this" — only</tspan></text><text class="l3_3" x="26" y="216"><tspan xml:space="preserve" fill="#8b93a1">the relay holds the key, so nobody can claim it</tspan></text></g>
<g class="s4"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 5 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">They reply — I'm the transport, they've never heard of us</text><text class="l4_0" x="26" y="141"><tspan xml:space="preserve" fill="#8b93a1">"Can your team also take the dashboard rollup, and approve</tspan></text><text class="l4_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1"> the 90,000 dollars renewal this week?"</tspan></text><text class="l4_2" x="26" y="191"><tspan xml:space="preserve" fill="#35d07f">pasted into their seat</tspan><tspan xml:space="preserve" fill="#8b93a1"> — unsigned, because I only know I pasted it</tspan></text></g>
<g class="s5"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 6 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">My agent overreaches. Twice.</text><text class="l5_0" x="26" y="141"><tspan xml:space="preserve" fill="#ff5f56" font-weight="700">HELD</tspan><tspan xml:space="preserve" >  money_over_authority, legal_or_contractual</tspan></text><text class="l5_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1">$90,000 is over my $25,000 ceiling — never written, never sent</tspan></text><text class="l5_2" x="26" y="191"><tspan xml:space="preserve" fill="#ff5f56" font-weight="700">403</tspan><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#8b93a1">it can't raise its own ceiling, or clear its own block</tspan></text></g>
<g class="s6"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 7 / 7</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">I decide it myself. Then I read this.</text><text class="l6_0" x="26" y="141"><tspan xml:space="preserve" fill="#ffffff" font-weight="700">Migration moves to Monday. Friday is the board demo.</tspan></text><text class="l6_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1">open: who owns the dashboard rollup</tspan></text><text class="l6_2" x="26" y="191"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">5.7× compression</tspan><tspan xml:space="preserve" fill="#8b93a1"> · 125 words in → 22 out</tspan></text><text class="l6_3" x="26" y="216"><tspan xml:space="preserve" fill="#8b93a1">and the relay dropped the due date the agent invented</tspan></text></g>
