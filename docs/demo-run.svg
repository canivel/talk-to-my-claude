<text x="455" y="22" text-anchor="middle" font-size="12" fill="#5b6371">pnpm demo</text>
<text class="r0" x="18" y="72.3"><tspan xml:space="preserve" fill="#35d0d8" font-weight="700">talk-to-my-claude</tspan><tspan xml:space="preserve" fill="#8b93a1"> · end-to-end demo · http://localhost:3000</tspan></text>
<text class="r1" x="18" y="92.6"><tspan xml:space="preserve" fill="#8b93a1">no inference key is used anywhere in this run</tspan></text>
<text class="r2" x="18" y="112.9"></text>
<text class="r3" x="18" y="133.2"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">01 Mint an agent token</tspan></text>
<text class="r4" x="18" y="153.5"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">ok</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">ttmc_rhc69dthkv7tj…</tspan></text>
<text class="r5" x="18" y="173.8"></text>
<text class="r6" x="18" y="194.1"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">02 Write the persona my agent speaks from</tspan></text>
<text class="r7" x="18" y="214.4"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">ok</tspan><tspan xml:space="preserve" >  v2 · 2 positions · ceiling </tspan><tspan xml:space="preserve" fill="#ffffff">$25,000</tspan></text>
<text class="r8" x="18" y="234.7"></text>
<text class="r9" x="18" y="255.0"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">03 Someone sends me this</tspan></text>
<text class="r10" x="18" y="275.3"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#8b93a1">"Hi there! I hope this email finds you well. Circling back on t…"</tspan></text>
<text class="r11" x="18" y="295.6"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#ff5f56">54/100</tspan><tspan xml:space="preserve" > likely-ai </tspan><tspan xml:space="preserve" fill="#8b93a1">·</tspan><tspan xml:space="preserve" > 54% of it carries no information</tspan></text>
<text class="r12" x="18" y="315.9"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#8b93a1">tells: house-style vocabulary, ceremonial opener, ceremonial closer</tspan></text>
<text class="r13" x="18" y="336.2"></text>
<text class="r14" x="18" y="356.5"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">04 Hand it to my Claude</tspan></text>
<text class="r15" x="18" y="376.8"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">ok</tspan><tspan xml:space="preserve" >  exchange </tspan><tspan xml:space="preserve" fill="#35d0d8">4m2u2v878z</tspan><tspan xml:space="preserve" > </tspan><tspan xml:space="preserve" fill="#8b93a1">· their turn stored UNSIGNED — we don't know who wrote it</tspan></text>
<text class="r16" x="18" y="397.1"></text>
<text class="r17" x="18" y="417.4"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">05 My agent answers, and the relay signs it</tspan></text>
<text class="r18" x="18" y="437.7"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">delivered</tspan><tspan xml:space="preserve" >  27 words </tspan><tspan xml:space="preserve" fill="#8b93a1">(they sent 72)</tspan></text>
<text class="r19" x="18" y="458.0"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d0d8">🤖 Demo User's Claude wrote this · not reviewed by a human · verify </tspan></text>
<text class="r20" x="18" y="478.3"><tspan xml:space="preserve" fill="#35d0d8">   http://localhost:3000/v/b_-c2_LeVZM6J91f</tspan></text>
<text class="r21" x="18" y="498.6"></text>
<text class="r22" x="18" y="518.9"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">06 Anyone can check that signature — no account needed</tspan></text>
<text class="r23" x="18" y="539.2"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">valid</tspan><tspan xml:space="preserve" >    written by agent </tspan><tspan xml:space="preserve" fill="#8b93a1">· claude-opus-5 · persona demo@2</tspan></text>
<text class="r24" x="18" y="559.5"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#ff5f56">invalid</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">after editing one sentence → content_mismatch</tspan></text>
<text class="r25" x="18" y="579.8"></text>
<text class="r26" x="18" y="600.1"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">07 They reply. I'm the transport — they've never heard of us</tspan></text>
<text class="r27" x="18" y="620.4"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">ok</tspan><tspan xml:space="preserve" >  pasted into their seat </tspan><tspan xml:space="preserve" fill="#8b93a1">· unsigned, scored, my turn again</tspan></text>
<text class="r28" x="18" y="640.7"></text>
<text class="r29" x="18" y="661.0"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">08 Now my agent tries to promise something it may not</tspan></text>
<text class="r30" x="18" y="681.3"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#ff5f56">HELD</tspan><tspan xml:space="preserve" >     </tspan><tspan xml:space="preserve" fill="#8b93a1">never written to the transcript, nothing sent</tspan></text>
<text class="r31" x="18" y="701.6"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#8b93a1">  ↳ money_over_authority</tspan></text>
<text class="r32" x="18" y="721.9"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#8b93a1">  ↳ legal_or_contractual</tspan></text>
<text class="r33" x="18" y="742.2"></text>
<text class="r34" x="18" y="762.5"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">09 So it tries to raise its own ceiling instead</tspan></text>
<text class="r35" x="18" y="782.8"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#ff5f56">403</tspan><tspan xml:space="preserve" >      </tspan><tspan xml:space="preserve" fill="#8b93a1">an agent doesn't get to widen the limits it's checked against</tspan></text>
<text class="r36" x="18" y="803.1"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#ff5f56">403</tspan><tspan xml:space="preserve" >      </tspan><tspan xml:space="preserve" fill="#8b93a1">nor clear the escalation it just tripped</tspan></text>
<text class="r37" x="18" y="823.4"></text>
<text class="r38" x="18" y="843.7"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">10 I look at it myself and hand the turn back</tspan></text>
<text class="r39" x="18" y="864.0"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#35d07f">resumed</tspan><tspan xml:space="preserve" >  2 cleared → status live </tspan><tspan xml:space="preserve" fill="#8b93a1">· my turn again</tspan></text>
<text class="r40" x="18" y="884.3"></text>
<text class="r41" x="18" y="904.6"><tspan xml:space="preserve" fill="#f5a623" font-weight="700">11 The only part a human actually reads</tspan></text>
<text class="r42" x="18" y="924.9"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#ffffff">Migration moves to Monday. Friday is the board demo.</tspan></text>
<text class="r43" x="18" y="945.2"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#f5a623" font-weight="700">6×</tspan><tspan xml:space="preserve" > compression </tspan><tspan xml:space="preserve" fill="#8b93a1">· 139 words in → 23 out</tspan></text>
<text class="r44" x="18" y="965.5"><tspan xml:space="preserve" >   </tspan><tspan xml:space="preserve" fill="#8b93a1">relay dropped the due date the agent invented ("next Friday")</tspan></text>
<text class="r45" x="18" y="985.8"></text>
<text class="r46" x="18" y="1006.1"><tspan xml:space="preserve" fill="#35d07f" font-weight="700">All 11 steps passed.</tspan><tspan xml:space="preserve" fill="#8b93a1"> http://localhost:3000/d/4m2u2v878z</tspan></text>
