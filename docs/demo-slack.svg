<rect width="718" height="256" rx="10" fill="#07080a"/>
<rect x="1" y="36" width="716" height="219" fill="#0e1014"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
<circle cx="39" cy="18" r="5.5" fill="#ffbd2e"/>
<circle cx="58" cy="18" r="5.5" fill="#27c93f"/>
<text x="359" y="23" text-anchor="middle" font-size="12" fill="#5b6371">pnpm demo:slack</text>
<text x="26" y="64" font-size="15" font-weight="700" fill="#35d0d8">talk-to-my-claude<tspan font-weight="400" fill="#5b6371">  · detect, then decide</tspan></text>
<g class="s0"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 1 / 5</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">An unsigned request — is it really Slack?</text><text class="l0_0" x="26" y="141"><tspan xml:space="preserve" fill="#35d07f">401</tspan><tspan xml:space="preserve" > </tspan><tspan xml:space="preserve" fill="#8b93a1">rejected before the payload is even parsed</tspan></text></g>
<g class="s1"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 2 / 5</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">A colleague writes to you, personally</text><text class="l1_0" x="26" y="141"><tspan xml:space="preserve" fill="#35d07f">ignored</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">No sign this was machine-written.</tspan></text><text class="l1_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1">no signature, low boilerplate — nothing says a machine wrote it</tspan></text></g>
<g class="s2"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 3 / 5</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">Obvious slop, but still only a guess</text><text class="l2_0" x="26" y="141"><tspan xml:space="preserve" fill="#f5a623">agent-likely</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">Detected as agent-likely, and your policy needs </tspan></text><text class="l2_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1">  agent-verified before answering automatically.</tspan></text><text class="l2_2" x="26" y="191"><tspan xml:space="preserve" fill="#8b93a1">style is not provenance — the heuristic alone never triggers a reply</tspan></text></g>
<g class="s3"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 4 / 5</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">Their Claude writes, and it carries a signature</text><text class="l3_0" x="26" y="141"><tspan xml:space="preserve" fill="#35d07f" font-weight="700">agent-verified</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">TTMC-1 signature checked against the exact wording</tspan></text><text class="l3_1" x="26" y="166"><tspan xml:space="preserve" fill="#35d07f">auto-answer</tspan><tspan xml:space="preserve" >  </tspan><tspan xml:space="preserve" fill="#8b93a1">queued for my Claude — it replies over MCP, into the thread</tspan></text></g>
<g class="s4"><text x="26" y="104" font-size="12" fill="#5b6371" xml:space="preserve">STEP 5 / 5</text><text x="110" y="104" font-size="15" font-weight="700" fill="#f5a623">Same signature, but I said to always ask me about this</text><text class="l4_0" x="26" y="141"><tspan xml:space="preserve" fill="#35d07f">agent-verified</tspan><tspan xml:space="preserve" fill="#8b93a1">, and still</tspan><tspan xml:space="preserve" > </tspan><tspan xml:space="preserve" fill="#ff5f56" font-weight="700">not answered</tspan></text><text class="l4_1" x="26" y="166"><tspan xml:space="preserve" fill="#8b93a1">Machine-written, but it is about something you asked to be asked about. </tspan></text><text class="l4_2" x="26" y="191"><tspan xml:space="preserve" fill="#8b93a1">  That stays with you.</tspan></text><text class="l4_3" x="26" y="216"><tspan xml:space="preserve" fill="#8b93a1">detection says machine; my own fence says ask me — both have to agree</tspan></text></g>
